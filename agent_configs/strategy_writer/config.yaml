# Hermes Agent Configuration
# 生成时间：2026-05-15
# 更新：增加 WebBridge 支持、Kimi Code Provider

model:
  default: claude-sonnet-4-6
  provider: anthropic
  base_url: https://api.kimi.com/coding/
  context_length: 200000

api_server:
  enabled: true
  host: 0.0.0.0

tools:
  enabled:
    - terminal
    # - browser         # ← 禁用：容器内无浏览器引擎，使用 WebBridge 替代
    - web_search
    - file
    - memory
    - vision

terminal:
  backend: local
  timeout: 1800
  allowed_commands:
    - python3
    - uv                # 用于安装 Python 包
    - pip
    - ls
    - cat
    - mkdir
    - curl

memory:
  enabled: true
  type: sqlite

skills:
  auto_learn: true
  auto_save: true
  hub:
    enabled: false

# ── 审批配置（无人值守模式）──────────────────────
approvals:
  mode: off
